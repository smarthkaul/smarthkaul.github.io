<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        background-color: #2f8f4e;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0) 0, rgba(0,0,0,0) 60px,
          rgba(0,0,0,0.06) 60px, rgba(0,0,0,0.06) 120px
        );
        font-family: Inter, system-ui, sans-serif;
      }

      /* Court sits on the right, bled off the edge like a broadcast plate */
      .court {
        position: absolute;
        top: 132px;
        right: 58px;
        width: 624px;
        opacity: 0.94;
      }

      .copy {
        position: absolute;
        left: 64px;
        top: 152px;
        width: 560px;
      }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 19px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #d6f84c;
        margin-bottom: 22px;
      }
      .name {
        font-family: Syne, system-ui, sans-serif;
        font-weight: 800;
        font-size: 90px;
        line-height: 0.94;
        color: #f4f1e9;
        letter-spacing: -0.02em;
        text-shadow: 0 6px 26px rgba(0,0,0,0.28);
      }
      .rule {
        width: 92px; height: 5px;
        background: #d6f84c;
        margin: 28px 0 22px;
        border-radius: 3px;
      }
      .tagline {
        font-size: 29px;
        font-weight: 400;
        color: rgba(244,241,233,0.92);
        line-height: 1.34;
      }

      /* Broadcast lower band */
      .band {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 78px;
        background: #4c2c69;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 72px;
      }
      .band span {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 20px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #f4f1e9;
      }
      .band .url { color: #d6f84c; }
      .dot {
        display: inline-block;
        width: 11px; height: 11px;
        border-radius: 50%;
        background: #d6f84c;
        margin-right: 14px;
        vertical-align: 1px;
      }
    </style>
  </head>
  <body>
    <!-- Real court geometry, same coordinates as Court.jsx -->
    <svg class="court" viewBox="0 0 780 360" fill="none">
      <rect x="140" y="20" width="500" height="320" rx="6" fill="#276e3c" />
      <g stroke="#ffffff" stroke-width="3">
        <rect x="140" y="20" width="500" height="320" />
        <line x1="140" y1="60" x2="640" y2="60" />
        <line x1="140" y1="300" x2="640" y2="300" />
        <line x1="265" y1="60" x2="265" y2="300" />
        <line x1="515" y1="60" x2="515" y2="300" />
        <line x1="265" y1="180" x2="515" y2="180" />
      </g>
      <line x1="390" y1="20" x2="390" y2="340" stroke="#f4f1e9" stroke-width="4" />

      <!-- Signature serve: Hawk-Eye trail into the far service box -->
      <path
        d="M 155 180 Q 300 60 452 120"
        stroke="#d6f84c" stroke-width="4"
        stroke-dasharray="2 13" stroke-linecap="round"
        opacity="0.95"
      />
      <circle cx="452" cy="120" r="19" fill="none" stroke="#d6f84c" stroke-width="3" opacity="0.5" />
      <circle cx="155" cy="180" r="9.5" fill="#d6f84c" />
    </svg>

    <div class="copy">
      <div class="eyebrow">Portfolio</div>
      <div class="name">Smarth<br />Kaul</div>
      <div class="rule"></div>
      <div class="tagline">Statistics &amp; Machine Learning<br />University of Toronto</div>
    </div>

    <div class="band">
      <span><i class="dot"></i>Now serving</span>
      <span class="url">smarthkaul.github.io</span>
    </div>
  </body>
</html>
