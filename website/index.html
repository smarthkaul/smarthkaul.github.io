<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smarth Kaul — Statistics & Machine Learning</title>
    <meta name="description" content="Statistics and machine learning at the University of Toronto, graduating 2026. Time-series forecasting, calibrated prediction models, and three data internships." />
    <meta name="theme-color" content="#2f8f4e" />
    <link rel="canonical" href="https://smarthkaul.github.io/" />

    <!-- Social preview card. Scrapers (LinkedIn, Slack, iMessage, X, Discord)
         do not run JavaScript, so these must live here in the static HTML —
         nothing React renders is visible to them. og:image MUST be an absolute
         URL; a relative path silently renders an imageless card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smarth Kaul" />
    <meta property="og:url" content="https://smarthkaul.github.io/" />
    <meta property="og:title" content="Smarth Kaul — Statistics &amp; Machine Learning" />
    <meta property="og:description" content="Statistics and machine learning at the University of Toronto, graduating 2026. Time-series forecasting, calibrated prediction models, and three data internships." />
    <meta property="og:image" content="https://smarthkaul.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A tennis court in Wimbledon colours with a serve arcing into a service box, captioned Smarth Kaul — Statistics and Machine Learning." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smarth Kaul — Statistics &amp; Machine Learning" />
    <meta name="twitter:description" content="Statistics and machine learning at the University of Toronto, graduating 2026. Forecasting and calibrated prediction models." />
    <meta name="twitter:image" content="https://smarthkaul.github.io/og.png" />

    <script type="text/javascript">
      // Single-Page Apps for GitHub Pages — restores the path 404.html encoded.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
